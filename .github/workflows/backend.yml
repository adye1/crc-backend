name: backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-crc-backend
  FUNCTION_APP: func-crc-86960

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt pytest
      - run: python -m pytest api/tests -q
      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      # Supply-chain checks: SBOM of what actually ships, then two independent vulnerability sources
      - name: Install dependencies as they will ship
        run: pip install -r api/requirements.txt --target api/.python_packages/lib/site-packages
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: api/.python_packages
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      - name: Vulnerability scan 1 - Grype (fails on High or above)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high
      - name: Vulnerability scan 2 - pip-audit (PyPI advisory data)
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      apiUrl: ${{ steps.infra.outputs.apiUrl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure (Bicep)
        id: infra
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: infra/main.bicepparam
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Bundle Python dependencies into the package
        run: pip install -r api/requirements.txt --target api/.python_packages/lib/site-packages
      - name: Deploy function code
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: api

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Wait for the new deployment to answer
        env:
          API_URL: ${{ needs.deploy.outputs.apiUrl }}
        run: |
          curl -fsS --retry 8 --retry-delay 10 --retry-all-errors "$API_URL"
          echo "CYPRESS_BASE_URL=${API_URL%/api/visitors}" >> "$GITHUB_ENV"
      - name: Cypress end-to-end tests against the live API
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6
